name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: python -m pytest

  release:
    name: Build and publish release
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install "build>=1.2"
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          SMOKE_ROOT="$(mktemp -d)"
          python -m venv "${SMOKE_ROOT}/venv"
          "${SMOKE_ROOT}/venv/bin/python" -m pip install dist/*.whl
          ACTUAL_VERSION="$("${SMOKE_ROOT}/venv/bin/agent-lane" --version)"
          test "${ACTUAL_VERSION}" = "agent-lane ${EXPECTED_VERSION}"
      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          TAG_OBJECT_TYPE="$(git cat-file -t "${TAG}")"
          if [ "${TAG_OBJECT_TYPE}" != "tag" ]; then
            echo "Release tags must be annotated; ${TAG} is ${TAG_OBJECT_TYPE}." >&2
            exit 1
          fi
          RELEASE_COMMIT="$(git rev-list -n 1 "${TAG}")"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          ARGS=(
            --tag "${TAG}"
            --repository-url "${REPOSITORY_URL}"
            --commit-sha "${RELEASE_COMMIT}"
            --output release-notes.md
          )
          if [ -n "${PREVIOUS_TAG}" ]; then
            ARGS+=(--previous-tag "${PREVIOUS_TAG}")
          fi
          python scripts/release_notes.py "${ARGS[@]}"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          FLAGS=(
            --verify-tag
            --title "agent-lane ${TAG}"
            --notes-file release-notes.md
          )
          if [[ "${TAG}" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" "${FLAGS[@]}" dist/*.whl dist/*.tar.gz
